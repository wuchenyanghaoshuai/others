apiVersion: apps/v1
kind: Deployment
metadata:
  name: gin-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gin-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:
      maxUnavailable: 0
  minReadySeconds: 5
  revisionHistoryLimit: 10
  template:
    metadata:
      labels:
        app: gin-demo
      annotations:
        instrumentation.opentelemetry.io/inject-go: "true"
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: "/app/main"
        instrumentation.opentelemetry.io/container-names: "gin-demo"
    spec:
      containers:
      - name: gin-demo
        image: registry.cn-hangzhou.aliyuncs.com/wuchenyang/gin-demo:v4
        securityContext:
          privileged: true
          runAsUser: 0
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /ping
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: 0.5
          limits:
            memory: "512Mi"
            cpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: gin-demo-service
  namespace: default
spec:
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: NodePort
  selector:
    app: gin-demo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-gin-demo
spec:
  ingressClassName: nginx
  rules:
  - host: gin.wuchenyangzhendehaoshuai.com
    http:
      paths:
      - backend:
          service:
            name: gin-demo-service
            port:
              number: 8081
        path: /
        pathType: ImplementationSpecific